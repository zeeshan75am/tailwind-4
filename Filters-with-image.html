<!DOCTYPE html>
<html lang="en">
<head>
    <title>Filter with Image in tailwind</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="flex">
    <h1 class="blur text-black">Blur Image</h1>
    <img class="size-100" src="nature.jpg" >
    <img class="size-100 blur" src="nature.jpg" >
    <img class="size-100 blur-sm" src="nature.jpg" >
    <img class="size-100 blur-md" src="nature.jpg" >
    <img class="size-100 blur-3xl" src="nature.jpg" >

    <h1>Brightness</h1>
    <img class="size-100" src="nature.jpg">
    <img class="size-100 brightness-50" src="nature.jpg">
    <img class="size-100 brightness-100" src="nature.jpg">
    <img class="size-100 brightness-900" src="nature.jpg">
    <img class="size-100 brightness-300" src="nature.jpg">
</body>
</html>
