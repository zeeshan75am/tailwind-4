<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <link href="./output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
      <div>
        <div class="sm:flex-column lg:flex">
            <div class="w-[900px] h-screen bg-gray-800 p-4  text-white flex ">
                <div class=" lg:w-[382px] sm:w-[500px]  h-[442px] mt-24 ml-16 ">
                    <div>
                        <img src="https://xcrm.live/static/media/X%20CRM%20LOGO-01.01abab317ae1ea4da557.png" alt="" class="w-[455px] h-[160px]">
                    </div>
                    <h2 class=" mt-20 items-center text-center font-bold lg:text-3xl sm:text-7xl ">Customer Relationship Management</h2>
                    <p class="text-center mt-10 text-gray-500 sm:text-3xl lg:text-lg">Streamline your business operations and manage customer relationships efficiently</p>
                </div>
            </div>
            <div class="w-full h-screen flex flex-col items-center justify-center  ">
                <div class=" text-gray-400 h-[500px] w-[480px]">
                     <div>
                    <div class="">
                        <h1 class="font-bold text-3xl text-black">SIGN IN</h1>
                        <p class="mt-1">Welcome back! Please enter your credentials</p>
                    </div>
                 </div>
                 <form>
                    <div class=" mt-10">
                        <label class="text-gray-700" for="email"> Email</label>
                        <div class="w-[480px] h-[50px] border p-2.5 rounded-lg mt-2" >
                            <i class="fas fa-envelope"></i>
                            <input class="ml-2" placeholder="Enter your email " type="email">
                        </div>
                    </div>

                    <div class=" mt-5">
                        <label class="text-gray-700"  for="password">Password</label>
                        <div class="w-[480px] h-[50px] border p-2.5 rounded-lg mt-2">
                            <i class="fas fa-lock"></i>
                            <input class="ml-2" placeholder="Enter your password" type="password ">
                            </div>
                        </div>

                        <div class="mt-5">
                            <div>
                                <input type="checkbox" id="remember">
                                <label class="ml-2" for="remember">Remember me</label>
                            </div>
                        </div>

                        <button class="bg-blue-700 w-[480px] h-[50px] border p-2.5 rounded-lg text-white mt-5">LOG IN</button>
                        <div>
                            <p class="text-gray-500 text-sm mt-10 text-center ">© 2026 Eraxon.</p>
                            
                        </div>
                </div>
                    </div>
                 </form>

            </div>
        </div>
      </div>
 
</body>
</html>
