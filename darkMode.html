<!DOCTYPE html>
<html lang="en" id="root" class="dark">

<head>
    <title>Dark Mode</title>
    <link rel="stylesheet" href="./output.css">
    <script>
        function changeMode(){
    document.documentElement.classList.toggle("dark");
        }
    </script>
</head>
<body>

    <button class=" border border-slate-800 m-2 p-2 rounded hover:bg-slate-100"
    onclick="changeMode()"
    >Apply Dark Mode</button>
    

    <div class="text-7xl dark:bg-slate-800">
        <h1 class="text-7xl dark:bg-slate-800 dark:text-white">
            Lorem ipsum dolor sit amet.
        </h1>
        <p class="text-4xl dark:text-white">
            Lorem ipsum dolor sit amet consectetur adipisicing elit.
        </p>
    </div>

    <div class="flex m-20 border border-slate-700 p-3 dark:bg-slate-800 dark:border-yellow-800">
        <div class="bg-blue-200 size-12 dark:bg-black"></div>

        <p class="text-2xl ml-10 p-2 dark:text-white">Lorem, ipsum dolor.</p>
    </div>

</body>
</html>
